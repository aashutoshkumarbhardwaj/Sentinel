[project]
name = "incident-agent"
version = "0.1.0"
requires-python = '>=3.12,<3.13'

dependencies = [
    "langchain-openai>=1.7.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "sim"]
testpaths = ["tests"]

